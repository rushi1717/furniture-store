#spring.application.name=API-GATEWAY


spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:3000"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
          routes:
            - id: auth-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/auth/**

            # ---------- CMS-Service APIs ----------
            - id: cms-service
              uri: lb://cms-service
              predicates:
                - Path=/api/v1/homepage/**

            # ---------- Inventory-Service APIs ----------
            - id: inventory-user
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/inventory/**
                - Method=POST
              filters:
                - AuthenticationFilter
              metadata:
                roles: USER,ADMIN

            - id: inventory-admin
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/inventory/create,/api/v1/inventory/confirm
                - Method=POST
              filters:
                - AuthenticationFilter
              metadata:
                roles: ADMIN

            # ---------- Authenticated Order APIs ----------
            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/orders/**
              metadata:
                roles: USER,ADMIN
              filters:
                - AuthenticationFilter

            # ---------- PUBLIC PRODUCT APIs ----------
            - id: product-public
              uri: ${PRODUCT_SERVICE_URL}
              predicates:
                - Path=/api/v1/products/**
                - Method=GET

            # ---------- Authenticated PRODUCT APIs ----------
            - id: product-admin
              uri: ${PRODUCT_SERVICE_URL}
              predicates:
                - Path=/api/v1/products/**
                - Method=POST,PUT,DELETE
              filters:
                - AuthenticationFilter
              metadata:
                roles: ADMIN

            # ---------- Authenticated User APIs ----------
            - id: user-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/v1/users/**
                - Method=GET,POST,PUT,DELETE
              filters:
                - AuthenticationFilter
              metadata:
                roles: USER

  main:
    web-application-type: reactive
server:
  port: 8000
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.server: DEBUG